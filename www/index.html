<!DOCTYPE html>
<html>
  <head>
    <title>edj</title>
    <link rel="stylesheet" type="text/css" href="edj.css">
    <meta name="description" content="edj function reference">
    <meta name="keywords" content="edj, function reference, index">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      div.tipBox { 
        font-size: 120%;
        display: inline-block;
      }
      div.tipBox div.edj {
        font-size: 250%;
        display: inline-block;
      }
      div.tipBox a.tip {
	display:inline-block;
	white-space: normal;
	max-width:50vw;
	text-align:left;
      }
      #content>td {
        overflow-x:hidden;
        overflow-y:auto;
        height:calc(100vh - 4.5em);
        padding: 0;
        margin:0;
      }
      #content>td>iframe {
        width: 100%;
        height: 99%;
        padding: 1;
        /*border: none;*/
      }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1/jquery.min.js"></script>
    <script src="search.js"></script>
    <script src="f/flist.js"></script>
    <script src="op/oplist.js"></script>
    <script src="kwlist.js"></script>
    <script>
	// This is a collection of all searchable lists
	var searchable = [
	    {label:"edj functions", query:"f", member:"function", list:flist},
	    {label:"edj operators", query:"op", member:"opcategory", list:oplist},
	    {label:"All documentation", member:"keyword", list:kwlist}
	];
	var searches;

	var tips = [
	    {text:"\"edj\" is not an acronym. I just wanted a short<br/>distinctive name with \"j\" in it."},
	    {text:"The curl plugin is good for writing API clients.", link:"p=curl"},
	    {text:"JavaScript? Not quite. SQL? A tiny bit."},
	    {text:"Interactive? Hell yeah, when you want it."},
	    {text:"Batch? Yes in so many ways."},
	    {text:"Most common JavaScript functions are available", link:"f"},
	    {text:"The <tt>function</tt> command with no arguments<br/>lists all user-defined functions", link:"cmd=function"},
	    {text:"Try <tt>function</tt> <var>yourFunctionName</var> on a line by itself.", linkn:"cmd=function"},
	    {text:"The <var>array</var> <tt>#</tt> <var>expr</<var> operator filters arrays.", link:"op=each"},
	    {text:"The <var>table</var> <tt>#=</tt> <var>table</var> operator does a natural join.", link:"op=join"},
	    {text:"The <var>data</var> <tt>@</tt> <var>expr</var> operator does a deep search<br/>for data that makes expr true", link:"op=find"},
	    {text:"The <tt>find()</tt> function does a deep search<br/>for a given value", link:"f=find"},
	    {text:"The <tt>gap()</tt> function finds gaps in an array<br/>of numbers or dates/times/datetimes", link:"f=gap"},
	    {text:"The <tt>blob()</tt> function lets you work with binary data", link:"f=blob"},
	    {text:"The <tt>diff()</tt> function lists differences<br/>between two arrays or objects", link:"f=diff"},
	    {text:"The <tt>grep()</tt> function returns rows from a table<br/>that contain a given value, no matter how deeply nested", link:"f=grep"},
	    {text:"The <tt>money()</tt> function makes money values look pretty", link:"f=money"},
	    {text:"The <tt>unroll()</tt> function lets you treat nested tables as a \"join\"", link:"f=unroll"},
	    {text:"<tt>=</tt> and <tt>&lt;&gt;</tt> are case-insensitive<br/>string comparison operators", link:"op=equal"},
	    {text:"Many functions support an extra <tt>true</tt><br/>argument to make them case-insensitive"},
	    {text:"If a case-sensitive member name can't be found,<br/>then it tries a case-insensitive search"},
	    {text:"The <tt>.@</tt> operator is like <tt>.</tt> except that it'll do a deep search", link:"op=dot"},
	    {text:"The <tt>..</tt> operator is exactly like <tt>.</tt> but low precedence.<br/>This is handy when you're incrementally building a query.", link:"op=dot"},
	    {text:"The <tt>i...j</tt> returns an array of integers from i to j", link:"op=ellipsis"},
	    {text:"You can append to an array via <var>myArray</var><tt>[]=</tt><var>newValue</var>", link:"cmd=assign"},
	    {text:"Negative array subscripts count from the end of the array.", link:"op=subscript"},
	    {text:"You can use <var>table</var><tt>[</tt><var>key</var><tt>:</tt><var>value</var><tt>]</tt>to search for an element<br/>of table that contains a member with the given key and value.", link:"op=subscript"},
	    {text:"While <var>str1</var><tt>+</tt><var>str2</var> simply concatenates (as in JavaScript),</br/><var>str1</var><tt>-</tt><var>str2</var> concatenates with exactly one space between them", link:"op=arithmetic"},
	    {text:"Check out the SQL-like <tt>SELECT</tt> operator", link:"op=select"},
	    {text:"The <tt>VALUES</tt> operator assigns names to array elements,<br/>converting the array to an object.", link:"op=values"},
	    {text:"Many minor SQL operators are supported including<br/><tt>LIKE, IN, AND, OR, NOT,</tt> and <tt>BETWEEN...AND</tt>", link:"op=values"},
	    {text:"Plugins are easy to load and use!", link:"p"},
	    {text:"A table is simply a non-empty array of objects"},
	    {text:"The <tt>explain</tt> command describes a table schema", link:"cmd=explain"},
	    {text:"Running <tt>set sh</tt> causes tables to be<br/>output as shell variables", link:"cmd=set"},
	    {text:"Running <tt>set csv</tt> (with the csv plugin)<br/>causes tables to be output as CSV", link:"cmd=set"},
	    {text:"Running <tt>set grid</tt> causes tables to be output<br/>as a grid.  This is the default.", link:"cmd=set"},
	    {text:"Running <tt>set json</tt> causes tables<br/>to be output as JSON", link:"cmd=set"},
	    {text:"The \"grid\" table format is smart enough to handle<br/>newlines such as the output of <tt>wrap()</tt>", link:"f=wrap"},
	    {text:"ISO 8601 date arithmetic is easy!", link:"a=Dates_and_Times"},
	    {text:"You can read environment variables<br/>via $NAME, $NAME[<var>suffix</var>], or getenv(<var>name</var>)", link:"a=Working_with_Environment_Variables"},
	];

	// Show an ever-changing tip
	function showTip()
	{
	    // Choose a random tip and a random font
	    var tip = tips[Math.floor(Math.random() * tips.length)];

	    // Generate the link
	    var link = "index.html";
	    if (tip.link)
	        link = link + "?" + tip.link;

	    // Change the tip and link.
	    $("#edjtip").html(tip.text).attr("href", link);

	    // Arrange for it to change again after 10 seconds
	    window.setTimeout(showTip, 10000);
	}

	// Initialization
	$(document).ready(function(){
	    // If passed a f=function query string, load it in the main iframe
	    var namevalue = location.search.match(/\?([^=&]*)=?([^&]*)/);
	    if (namevalue) {
		if (!namevalue[2])
			namevalue[2] = "INTRO";

console.log(namevalue[1] + "=" + namevalue[2]);
		switch (namevalue[1]) {
		case 'lit': // Literals
		    $("#main").prop("src", "lit/" + namevalue[2] + ".html");
		    $("#sidebar").prop("src", "lit/sidebar.html?lit="+namevalue[2]);
		    break;
		case 'f': // Functions (edj, not C)
		    $("#main").prop("src", "f/" + namevalue[2] + ".html");
		    $("#sidebar").prop("src", "f/sidebar.html?f="+namevalue[2]);
		    break;
		case 'op': // Operators
		    $("#main").prop("src", "op/" + namevalue[2] + ".html");
		    $("#sidebar").prop("src", "op/sidebar.html?op="+namevalue[2]);
		    break;
		case 'cmd': // Commands
		    $("#main").prop("src", "cmd/" + namevalue[2] + ".html");
		    $("#sidebar").prop("src", "cmd/sidebar.html?cmd="+namevalue[2]);
		    break;
		case 'p': // Plugins
		    $("#main").prop("src", "plugin/" + namevalue[2] + ".html");
		    $("#sidebar").prop("src", "plugin/sidebar.html?p="+namevalue[2]);
		    break;
		case 'a': // Articles
		    $("#main").prop("src", "a/" + namevalue[2] + ".html");
		    $("#sidebar").prop("src", "a/sidebar.html?a="+encodeURIComponent(namevalue[2]));
		    break;
		case 'tutorial': // Tutorial
		    $("#main").prop("src", "tutorial/" + namevalue[2] + ".html");
		    $("#sidebar").prop("src", "tutorial/sidebar.html?tutorial="+encodeURIComponent(namevalue[2]));
		    break;
		case 'quick': // Quick intro
		    $("#main").prop("src", "quick.html");
		    break;
		case 'main': // Other top-level topics (download, examples, etc)
		    $("#main").prop("src", namevalue[2] + ".html");
		    break;
		}
	    }

	    // Arrange for searching to work incrementally
	    searches = searchInput("[name=search]");

	    // Show the first tip.  Others will replace it every 10 seconds
	    showTip();
	});
    </script>
  </head>
  <body>
    <div class="popup"></div>
    <table class="layout">
      <colgroup>
        <col style="width:10vw">
        <col style="width:30vw">
        <col style="width:59vw">
      </colgroup>
      <tr id="top" style="height:4em;overflow:hidden;">
        <td colspan="3" style="vertical-align:middle; text-align: center">
          <a class="button" style="float:left; margin:0;" href="index.html"><img src="edjlogo.gif" style="height:3.5em; display:block" alt="edj" /></a>
	  <div style="float:right; padding-top: 1em;">
            <input type="search" name="search" autocomplete="off" placeholder="Search">
	  </div>
          <div class="tipBox"><div class="edj">edj</div> <a id="edjtip" class="tip" href="index.html">JSON Tool</a></div>
	</td>
      </tr>
      <tr id="content">
        <td>
          <iframe id="sidebar" src="sidebar.html"></iframe>
        </td>
        <td colspan="2">
          <iframe id="main" src="INTRO.html"></iframe>
        </td>
      </tr>
    </table>
  </body>
</html>
